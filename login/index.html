<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerminalWar :: Sector 204 Access</title>
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <canvas id="matrixCanvas" aria-hidden="true"></canvas>
    <div class="hud-overlay" aria-hidden="true"></div>

    <main class="screen">
      <section id="intro" class="panel intro-panel">
        <h2>BOOT SEQUENCE</h2>
        <pre id="introOutput"></pre>
      </section>

      <section id="authPanel" class="panel hidden">
        <div class="avatar-wrap">
          <div class="avatar-core">◉</div>
        </div>
        <h1>ACCESS TERMINAL</h1>
        <p class="subtitle">Welcome to Sector 204</p>

        <label for="username">Neural_ID (username)</label>
        <input id="username" type="text" autocomplete="username" placeholder="ghostrunner_7" />

        <label for="email">Signal_Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="operator@grid.net" />

        <label for="password">Decrypt_Key</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />

        <div class="actions">
          <button id="loginBtn">Log In</button>
          <button id="signupBtn" class="secondary">Sign Up</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./login.js"></script>
  </body>
</html>
