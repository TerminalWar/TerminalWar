<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerminalWar Game</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #0f1626, #000 64%);
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        width: min(760px, 92vw);
        border: 1px solid #2f395a;
        border-radius: 16px;
        padding: 28px;
        background: linear-gradient(180deg, rgba(27,34,56,.8), rgba(9,11,18,.95));
        box-shadow: 0 12px 40px rgba(0,0,0,.5);
        text-align: center;
      }
      #logoutBtn {
        margin-top: 14px;
        padding: 11px 16px;
        border: 1px solid #93a8ff;
        border-radius: 10px;
        background: #18213f;
        color: #dce5ff;
        cursor: pointer;
        font-weight: 700;
      }
      #statusText { color: #9eb4ff; min-height: 24px; }
    </style>
  </head>
  <body>
    <section class="card">
      <h1 id="welcomeText">Hello World</h1>
      <p id="statusText">Checking session...</p>
      <button id="logoutBtn" type="button">Logout</button>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
